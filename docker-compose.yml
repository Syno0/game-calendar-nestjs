version: "3"

services:
  # La base des comptes et des favoris. Elle n'expose aucun port sur l'hôte :
  # seuls les conteneurs du réseau game-calendar ont à l'atteindre.
  postgres:
    container_name: game-calendar-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      # Lu dans .env (non versionné) : ce fichier-ci est suivi par git, et le
      # vrai mot de passe y a fini dans un commit public le 2026-10-05.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: game_calendar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      # Adresse figée, et volontairement haute : Docker attribue les adresses
      # libres en partant du bas, donc un service laissé en dynamique peut
      # rafler une adresse réservée plus haut — ici le 172.20.0.8 du back.
      game-calendar:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d game_calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-calendar-nestjs:
    # Ni `container_name`, ni IP figée, ni port publié : un déploiement sans
    # coupure (rollout.sh) fait tourner un second conteneur à côté du premier
    # le temps de la bascule. Le port 3000 publié n'était tapé que par des
    # scanners. Le BFF joint ce service par l'alias réseau ci-dessous, qui
    # reprend l'ancien nom du conteneur : pendant une bascule, le DNS docker
    # renvoie les deux, et `BACK_API_URL` n'a pas eu à changer.
    mem_limit: 1g
    restart: unless-stopped
    image: game-calendar-nestjs:${NEST_TAG:-latest}
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=768
    # Chemin absolu : c'est l'ancien emplacement du projet, où tournent les
    # journaux depuis le début (voir CLAUDE.md). `./logs` les déplacerait.
    volumes:
      - /opt/game-calendar-github/logs:/app/logs
    # Forme simple plutôt que `condition: service_healthy`, que docker-compose v1
    # rejette en version "3". Si Postgres n'est pas encore prêt, `restart:
    # unless-stopped` relance le back jusqu'à ce qu'il se connecte.
    depends_on:
      - postgres
    networks:
      game-calendar:
        aliases:
          - game-calendar-nestjs
    # Nest n'ouvre son port qu'une fois Prisma connecté : un connect TCP
    # suffit à dire qu'il est prêt. Échoue dès que rollout.sh pose
    # /tmp/drain, pour sortir le conteneur du pool Traefik avant son arrêt.
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/drain && nc -z 127.0.0.1 3000"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    # main.ts laisse finir les requêtes en cours sur SIGTERM.
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      # ⚠️ Un routeur ou un service ne se modifie jamais sous le même nom :
      # pendant une bascule, Traefik supprimerait la définition en double.
      # `gamecalback` est ainsi devenu `nest`, avec une priorité explicite
      # pour l'emporter sur l'ancien dès son inscription.
      - "traefik.http.routers.nest.rule=Host(`gamecalback.sb-pro.fr`)"
      - "traefik.http.routers.nest.priority=50"
      - "traefik.http.routers.nest.entrypoints=websecure"
      - "traefik.http.routers.nest.tls.certresolver=myresolver"
      - "traefik.http.routers.nest.service=nest"
      - "traefik.http.routers.nest.middlewares=nest-retry"
      - "traefik.http.middlewares.nest-retry.retry.attempts=3"
      # Port explicite : sans port publié, Traefik ne saurait plus le deviner.
      - "traefik.http.services.nest.loadbalancer.server.port=3000"

# docker network create -d bridge --subnet=172.20.0.0/16 --gateway=172.20.0.1 game-calendar
networks:
  game-calendar:
    external: true

volumes:
  postgres_data:
